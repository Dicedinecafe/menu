<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Slideshow</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

          body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            cursor: none;
            background: #2d4a43;
        }

        .slideshow-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1.5s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide.active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="slideshow-container" id="slideshow"></div>

    <script>
        // Replace these example URLs with your own image URLs
        const imageUrls = [
           '1.png',
           '2.png',
           '3.png',
           '4.png',
           '5.png',
        ];
        let currentIndex = 0;

        async function loadImages() {
            try {
                const files = await window.fs.readdir('/');
                const imageFiles = files.filter(file => 
                    /\.(jpg|jpeg|png|gif|webp|bmp)$/i.test(file)
                );

                // If uploaded files are found, use those instead
                if (imageFiles.length > 0) {
                    imageUrls.length = 0; // Clear example URLs
                    for (const file of imageFiles) {
                        const data = await window.fs.readFile(file);
                        const blob = new Blob([data], { type: 'image/jpeg' });
                        const url = URL.createObjectURL(blob);
                        imageUrls.push(url);
                    }
                }

                if (imageUrls.length > 0) {
                    createSlides();
                    startSlideshow();
                }
            } catch (error) {
                console.error('Error:', error);
                // Use example images if file loading fails
                if (imageUrls.length > 0) {
                    createSlides();
                    startSlideshow();
                }
            }
        }

        function createSlides() {
            const container = document.getElementById('slideshow');
            imageUrls.forEach((url, index) => {
                const slide = document.createElement('div');
                slide.className = 'slide';
                const img = document.createElement('img');
                img.src = url;
                slide.appendChild(img);
                if (index === 0) slide.classList.add('active');
                container.appendChild(slide);
            });
        }

        function showSlide(index) {
            const slides = document.querySelectorAll('.slide');
            slides.forEach(slide => slide.classList.remove('active'));
            if (slides[index]) {
                slides[index].classList.add('active');
            }
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % imageUrls.length;
            showSlide(currentIndex);
        }

        function startSlideshow() {
            setInterval(nextSlide, 10000);
        }

        loadImages();
    </script>
</body>
</html>
